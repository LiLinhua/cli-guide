name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets into
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run dist:mac

      - name: List release artifacts
        run: ls -lh release/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*-mac.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts found in release/"
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
          gh release view "${{ inputs.tag }}"
